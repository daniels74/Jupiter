<nav class="navbar-shell" aria-label="Main navigation">
  <a class="navbar-logo" (click)="goToLanding()" routerLink="/">
    <img
      [src]="logoLightTheme ? '../../../assets/dark-zapp.png' : '../../../assets/transparent-cryptozapp.png'"
      alt="CryptoZapp home"
    />
  </a>

  <div class="navbar-search">
    <app-usersearch></app-usersearch>
  </div>

  <div *ngIf="screenSizeCheck" class="navbar-menu">
    <mat-slide-toggle
      class="theme-toggle"
      aria-label="Toggle color theme"
      (change)="switchMode($event)"
    ></mat-slide-toggle>
    <a class="navbar-link" (click)="goHome()" routerLink="/home" routerLinkActive="active-link">Home</a>
    <a
      class="navbar-link"
      *ngIf="authState"
      [routerLink]="['/user', id]"
      routerLinkActive="active-link"
    >{{ userName }}</a>
    <a
      class="navbar-link"
      *ngIf="authState"
      (click)="toggleSettings()"
    >Settings</a>
    <a
      class="navbar-link"
      *ngIf="!authState"
      (click)="login()"
      routerLink="/login"
      routerLinkActive="active-link"
    >Login</a>
    <a
      class="navbar-link"
      *ngIf="!authState"
      (click)="register()"
      routerLink="/register"
      routerLinkActive="active-link"
    >Register</a>
  </div>

  <button
    *ngIf="!screenSizeCheck"
    class="navbar-menu-toggle"
    type="button"
    aria-label="Toggle navigation menu"
    [attr.aria-expanded]="menuToggler"
    (click)="toggleMenu()"
  >
    <img src="../../../assets/menu.png" alt="" />
  </button>
</nav>
<div class="navbar-accent-line"></div>

<div *ngIf="loader" class="navbar-overlay" role="status" aria-label="Loading">
  <img src="assets/dragonspin.gif" alt="" />
</div>

<div *ngIf="menuToggler" class="navbar-panel mobile-menu">
  <div *ngIf="!loader" class="mobile-menu__links">
    <a class="navbar-link" (click)="goHome()" routerLink="/home" routerLinkActive="active-link">Home</a>
    <a
      class="navbar-link"
      *ngIf="authState"
      (click)="goToUserProfile()"
      [routerLink]="['/user', id]"
      routerLinkActive="active-link"
    >{{ userName }}</a>
    <a class="navbar-link" *ngIf="authState" (click)="toggleSettings()">Settings</a>
    <a class="navbar-link" *ngIf="!authState" (click)="login()" routerLink="/login" routerLinkActive="active-link">Login</a>
    <h4
      *ngIf="!authState"
      (click)="login()"
      routerLink="/login"
      routerLinkActive="active-link"
    ></h4>
    <a class="navbar-link" *ngIf="!authState" (click)="register()" routerLink="/register" routerLinkActive="active-link">Register</a>
    <mat-slide-toggle
      class="theme-toggle"
      aria-label="Toggle color theme"
      (change)="switchMode($event)"
    ></mat-slide-toggle>
  </div>
</div>

<div *ngIf="settingsToggle" class="settings-panel">
  <button class="settings-panel__close" type="button" aria-label="Close settings" (click)="toggleSettings()">
    <img src="../../../assets/cross.png" alt="" />
  </button>
  <button type="button" (click)="deleteAccount()" class="navbar-action">Delete Account</button>
  <button *ngIf="authState" type="button" (click)="logout()" class="navbar-action">Logout</button>
</div>
